name: FASTBOOT Omega ISA and freestanding source gates
on:
  pull_request:
    paths:
      - 'asm/**'
      - 'src/**'
      - 'include/**'
      - 'host/**'
      - 'tests/**'
      - '.github/workflows/fastboot-isa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-isa-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # GitHub-hosted checkout is build infrastructure only, not an ELF dependency.
      - name: Checkout exact source HEAD, no persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Exact SHA identity gate
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          printf 'HEAD=%s\n' "$EXACT_HEAD"
      - name: Select isolated build-only LLVM utilities (never link into L0)
        shell: bash
        run: |
          set -euo pipefail
          for t in cc clang nm readelf sha256sum; do command -v "$t"; done
          bindir="$RUNNER_TEMP/fastboot-llvm"
          mkdir -p "$bindir"
          select_llvm() {
            local tool="$1" found="" v
            found="$(command -v "$tool" || true)"
            if [ -z "$found" ]; then
              for v in 21 20 19 18 17 16 15 14; do
                found="$(command -v "$tool-$v" || true)"
                if [ -n "$found" ]; then break; fi
              done
            fi
            if [ -n "$found" ]; then ln -sfn "$found" "$bindir/$tool"; fi
            test -x "$bindir/$tool"
          }
          if ! select_llvm llvm-objcopy || ! select_llvm llvm-objdump; then
            echo 'LLVM binutils unavailable on runner; install BUILD-ONLY utilities (no binary runtime dependency)'
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends llvm-18
            select_llvm llvm-objcopy
            select_llvm llvm-objdump
          fi
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/llvm-objcopy" --version | head -1
          "$bindir/llvm-objdump" --version | head -1
      - name: C11 freestanding no-extern gate and transport compile-only
        shell: bash
        run: sh tests/run.sh
      - name: Bytewise ISA predecessor chain S4, S5 and S6
        shell: bash
        run: sh tests/run_asm.sh
      - name: Host sanitizer on bounded ISA state machine
        shell: bash
        run: |
          set -euo pipefail
          clang -std=c11 -O1 -g -fsanitize=address,undefined \
            -fno-omit-frame-pointer -Wall -Wextra -Werror -Wshadow -Wconversion \
            -Iinclude src/fb_omega.c tests/test_asm_session.c \
            asm/x86_64/fb_session.S -o build/test_asm_session_sanitized
          ASAN_OPTIONS=detect_leaks=1 ./build/test_asm_session_sanitized
      - name: Preserve provenance without declaring hardware PASS
        shell: bash
        run: |
          echo 'PASS_SCOPED=HOST_SYNTHETIC_AND_CROSS_ASSEMBLY'
          echo 'NOT_RUN=PHYSICAL_USB,PHYSICAL_ARM32,PHYSICAL_ARM64'
          echo 'claim_allowed=false'

  arm64-native-l0:
    # Native Arm-hosted GitHub Actions runner; not a local Android or USB device.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Execute AArch64 ISA differential tests at exact SHA
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test "$(uname -m)" = "aarch64"
          printf 'uname=%s SHA=%s\n' "$(uname -m)" "$EXACT_HEAD"
          printf '\n' | cc -dM -E -x c - | grep -q '^#define __aarch64__ 1$'
          EXPECTED_HEAD="$EXACT_HEAD" CC=cc sh tests/run_native_arm.sh
          # Additional independent native ARM64 check on the freestanding USB descriptor parser.
          cc -std=c11 -O2 -Wall -Wextra -Werror -Wshadow -Wconversion \
            -Iinclude src/fb_usb_desc.c tests/test_usb_desc_s10.c \
            -o build/test_usb_desc_s10_arm64_native
          ./build/test_usb_desc_s10_arm64_native
          readelf -h build/test_usb_desc_s10_arm64_native | grep -q 'Machine:.*AArch64'
          sha256sum build/test_usb_desc_s10_arm64_native
          echo 'PASS_SCOPED=NATIVE_ARM64_USERLAND; NOT_RUN=ANDROID_PHONE,USB_OTG,BAREMETAL_SOC'
          echo 'claim_allowed=false; promotion=false'

  armv7-qemu-emulated-l0:
    # Explicitly emulated ARMv7; never classify as native ARM or physical device.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source SHA (no retained credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Install cross-compiler and QEMU TEST-ONLY tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
      - name: Execute ARMv7 ASM differential tests under QEMU
        shell: bash
        env:
          EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_HEAD="$EXACT_HEAD" sh tests/run_armv7_qemu.sh
