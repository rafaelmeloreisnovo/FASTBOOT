name: FASTBOOT Omega S16 double-build and release authority
on:
  workflow_call:
    inputs:
      enforce_release:
        description: Fail the workflow when release authority or physical evidence is missing
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      enforce_release:
        description: Fail when release authority or physical evidence is missing
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pull-requests: read
jobs:
  independent-workers:
    name: Bytewise build ${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix:
        slot: [a, b]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact unprivileged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Ensure only build tools are available
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          if ! command -v llvm-objcopy >/dev/null && ! command -v llvm-objcopy-18 >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends llvm-18
          fi
      - name: Build nine freestanding objects and hash fifteen artifacts
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          S16_SLOT: ${{ matrix.slot }}
        run: |
          set -euo pipefail
          sh tests/s16_rebuild.sh
      - name: Upload build-only manifest, not sensitive device data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: s16-manifest-${{ matrix.slot }}
          path: build/s16-evidence/
          if-no-files-found: error
          retention-days: 14
  compare-manifests:
    name: Compare two independent worker manifests
    needs: independent-workers
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Download build manifests from two fresh runner instances
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: s16-manifest-*
          path: manifests
          merge-multiple: false
      - name: Compare fifteen bytewise artifacts
        shell: bash
        run: |
          set -euo pipefail
          a=manifests/s16-manifest-a/manifest-a.sha256
          b=manifests/s16-manifest-b/manifest-b.sha256
          test -s "$a" && test -s "$b"
          test "$(wc -l < "$a" | tr -d ' ')" -eq 15
          test "$(wc -l < "$b" | tr -d ' ')" -eq 15
          diff -u "$a" "$b"
          echo 'PASS_SCOPED=15_FREESTANDING_TEXT_AND_LAYOUT_ARTIFACT_HASHES_MATCH_ON_TWO_GITHUB_WORKERS'
          echo 'NOT_PROVEN=INDEPENDENT_OPERATOR_TRUST_ROOT,TOOLCHAIN_SECURITY,PHYSICAL_HARDWARE'
  release-authority:
    name: Record release authority state
    needs: compare-manifests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source without retained credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Verify twenty-two dangerous semantic mutations are denied
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tests/selftest_s16_authority.py
      - name: Classify authority without making validation falsely red
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUM: ${{ github.event.pull_request.number || 0 }}
          REBUILD_RESULT: ${{ needs.compare-manifests.result }}
          ENFORCE_RELEASE: ${{ inputs.enforce_release }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          if [ "$PR_NUM" -eq 0 ]; then
            printf '%s\n' '{"status":"NO_GO","reason":"NOT_PR_SCOPED","claim_allowed":false}' > build/s16-provider-receipt.json
            echo 'NO_GO_RECORDED=NOT_PR_SCOPED'
            if [ "$ENFORCE_RELEASE" = true ]; then exit 3; fi
            exit 0
          fi
          rebuild_flag=''
          if [ "$REBUILD_RESULT" = success ]; then rebuild_flag='--rebuild-pass'; fi
          set +e
          python3 -B tests/verify_s16_authority.py --repo "$GITHUB_REPOSITORY" \
            --head "$EXPECTED_HEAD" --pr "$PR_NUM" $rebuild_flag --enforce \
            --output build/s16-provider-receipt.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo 'RELEASE_AUTHORITY=GO'
            exit 0
          fi
          if [ "$rc" -eq 3 ]; then
            echo 'RELEASE_AUTHORITY=NO_GO_RECORDED'
            echo 'claim_allowed=false'
            if [ "$ENFORCE_RELEASE" = true ]; then
              echo 'Release enforcement requested: failing closed.'
              exit 3
            fi
            echo 'Validation mode: technical CI remains green; release remains blocked.'
            exit 0
          fi
          echo "Unexpected authority verifier error rc=$rc"
          exit "$rc"
      - name: Preserve typed authority receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: s16-provider-authority-receipt
          path: build/s16-provider-receipt.json
          if-no-files-found: error
          retention-days: 14
