name: Mi Assistant Android source contract
on:
  pull_request:
    paths:
      - 'host/android/**'
      - 'tests/verify_miassistant_source.py'
      - '.github/workflows/miassistant-android-source.yml'
  push:
    branches: [main]
    paths:
      - 'host/android/**'
      - 'tests/verify_miassistant_source.py'
      - '.github/workflows/miassistant-android-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify read-only Android host contract
        run: python3 -B tests/verify_miassistant_source.py
